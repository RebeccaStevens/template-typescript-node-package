name: Template Sync

# THIS FILE IS FROZEN — all sync logic lives in the reusable workflow
# (reusable-template-sync.yml). Renovate manages the `sync-v1` ref below;
# do not edit this file by hand.
#
# Secrets are inherited (`secrets: inherit`); the GitHub App credentials are
# resolved inside the reusable workflow from this repo's vars/secrets
# (vars.TEMPLATE_APP_ID / secrets.TEMPLATE_APP_KEY).

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday at 00:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-template-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template_sync:
    name: Sync with upstream template
    # Opt-in gate: sync runs only when the TEMPLATE_SYNC_ENABLED repo variable is "true".
    if: vars.TEMPLATE_SYNC_ENABLED == 'true'
    # TODO: pin the ref below to the full commit SHA of the `sync-v1` tag
    # (resolve via `git rev-parse sync-v1^{commit}`); Renovate/bumps must
    # update the pinned SHA, never the mutable tag.
    uses: RebeccaStevens/template-typescript-node-package/.github/workflows/reusable-template-sync.yml@sync-v1 # sync-v1
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
